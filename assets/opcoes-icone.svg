<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 25" width="1008" height="400" shape-rendering="crispEdges" font-family="Segoe UI, Arial, sans-serif">
  <rect width="63" height="25" fill="#0F1115"/>

  <!-- ===== A: baú do tesouro aberto (o acumulador de dados) ===== -->
  <g transform="translate(3 2)">
    <path fill="#1B1F27" d="M1 0h14v1h1v14h-1v1h-14v-1h-1v-14h1z"/>
    <!-- contorno -->
    <path fill="#2A1608" d="M4 1h8v1h-8z M3 2h1v4h-1z M12 2h1v4h-1z M3 6h1v2h-1z M12 6h1v2h-1z M2 8h12v1h-12z M2 9h1v5h-1z M13 9h1v5h-1z M2 14h12v1h-12z"/>
    <!-- tampa -->
    <path fill="#B5762F" d="M4 2h8v1h-8z M4 3h1v1h-1z M11 3h1v1h-1z M4 4h8v1h-8z"/>
    <path fill="#D9A04F" d="M5 3h6v1h-6z"/>
    <path fill="#7A4A1E" d="M4 5h8v1h-8z"/>
    <!-- luz azul saindo do baú -->
    <path fill="#60CDFF" d="M4 6h8v2h-8z"/>
    <path fill="#C8F0FF" d="M10 6h1v1h-1z M7 7h1v1h-1z"/>
    <!-- moedas e gema -->
    <path fill="#FFD84D" d="M5 6h2v1h-2z M5 7h1v1h-1z"/>
    <path fill="#C9971C" d="M6 7h1v1h-1z"/>
    <path fill="#A99CFF" d="M9 6h1v2h-1z"/>
    <path fill="#6C5CE7" d="M10 7h1v1h-1z"/>
    <!-- corpo do baú -->
    <path fill="#B5762F" d="M3 9h10v1h-10z M3 10h1v1h-1z M12 10h1v1h-1z M3 11h4v1h-4z M9 11h4v1h-4z M3 12h4v1h-4z M9 12h4v1h-4z"/>
    <path fill="#D9A04F" d="M4 10h8v1h-8z"/>
    <path fill="#7A4A1E" d="M3 13h10v1h-10z"/>
    <!-- fechadura dourada -->
    <path fill="#FFD84D" d="M7 11h2v1h-2z M7 12h1v1h-1z"/>
    <path fill="#C9971C" d="M8 12h1v1h-1z"/>
    <!-- brilhos -->
    <path fill="#C8F0FF" d="M1 5h1v1h-1z M14 3h1v1h-1z M14 7h1v1h-1z"/>
  </g>

  <!-- ===== B: pilha de disquetes ===== -->
  <g transform="translate(24 2)">
    <path fill="#1B1F27" d="M1 0h14v1h1v14h-1v1h-14v-1h-1v-14h1z"/>
    <!-- disquete amarelo (atrás) -->
    <rect x="1" y="1" width="10" height="10" fill="#20202C"/>
    <rect x="2" y="2" width="8" height="8" fill="#FFD84D"/>
    <!-- disquete vermelho (meio) -->
    <rect x="3" y="3" width="10" height="10" fill="#20202C"/>
    <rect x="4" y="4" width="8" height="8" fill="#E24B4B"/>
    <!-- disquete azul (frente) -->
    <rect x="5" y="5" width="10" height="10" fill="#20202C"/>
    <rect x="6" y="6" width="8" height="8" fill="#3B5BDB"/>
    <rect x="6" y="6" width="8" height="1" fill="#5C7CFA"/>
    <!-- janela de metal -->
    <rect x="8" y="6" width="5" height="3" fill="#C0C4D4"/>
    <rect x="11" y="7" width="1" height="2" fill="#7C8198"/>
    <!-- etiqueta -->
    <rect x="7" y="11" width="6" height="3" fill="#F4F4F8"/>
    <rect x="8" y="12" width="4" height="1" fill="#B0B4C4"/>
  </g>

  <!-- ===== C: estante de cartuchos ===== -->
  <g transform="translate(45 2)">
    <path fill="#1B1F27" d="M1 0h14v1h1v14h-1v1h-14v-1h-1v-14h1z"/>
    <!-- prateleiras -->
    <rect x="1" y="6" width="14" height="1" fill="#B5762F"/>
    <rect x="1" y="7" width="14" height="1" fill="#7A4A1E"/>
    <rect x="1" y="13" width="14" height="1" fill="#B5762F"/>
    <rect x="1" y="14" width="14" height="1" fill="#7A4A1E"/>
    <!-- fileira de cima -->
    <rect x="2" y="2" width="2" height="4" fill="#E24B4B"/>
    <rect x="5" y="3" width="2" height="3" fill="#FFD84D"/>
    <rect x="8" y="2" width="2" height="4" fill="#60CDFF"/>
    <rect x="11" y="3" width="2" height="3" fill="#A99CFF"/>
    <rect x="2" y="3" width="1" height="1" fill="#FFFFFF"/>
    <rect x="5" y="4" width="1" height="1" fill="#FFFFFF"/>
    <rect x="8" y="3" width="1" height="1" fill="#FFFFFF"/>
    <rect x="11" y="4" width="1" height="1" fill="#FFFFFF"/>
    <!-- fileira de baixo -->
    <rect x="2" y="9" width="2" height="4" fill="#6CCB5F"/>
    <rect x="5" y="10" width="2" height="3" fill="#FF9F45"/>
    <rect x="8" y="9" width="2" height="4" fill="#E8E8F0"/>
    <rect x="11" y="10" width="2" height="3" fill="#FF8AB5"/>
    <rect x="2" y="10" width="1" height="1" fill="#FFFFFF"/>
    <rect x="5" y="11" width="1" height="1" fill="#FFFFFF"/>
    <rect x="8" y="10" width="1" height="1" fill="#7C8198"/>
    <rect x="11" y="11" width="1" height="1" fill="#FFFFFF"/>
  </g>

  <!-- legendas -->
  <g fill="#C8C8C8" font-size="1.7" text-anchor="middle" shape-rendering="auto">
    <text x="11" y="22.4">A · Baú do tesouro</text>
    <text x="32" y="22.4">B · Disquetes</text>
    <text x="53" y="22.4">C · Estante de cartuchos</text>
  </g>
</svg>

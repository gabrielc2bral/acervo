name: Release

# Manual: no GitHub, Actions > Release > Run workflow, e informe a versão.
# Antes de rodar: suba a versão no Cargo.toml, escreva a seção "## [X.Y.Z]" no CHANGELOG.md e
# envie as mudanças. O fluxo confere tudo isso, roda os testes, compila otimizado, monta o
# instalador e cria o release (e a tag vX.Y.Z) com o instalador e o hash SHA-256 anexados.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar, igual à do Cargo.toml (ex.: 1.1.0)"
        required: true
        type: string
      prerelease:
        description: "Marcar como pré-lançamento"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versão inválida: '$env:VERSION'. Use MAJOR.MINOR.PATCH, por exemplo 1.1.0."
          }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($cargo -ne $env:VERSION) {
            throw "A versão pedida ($env:VERSION) não é a do Cargo.toml ($cargo). Atualize o Cargo.toml antes."
          }
          $header = '^## \[' + [regex]::Escape($env:VERSION) + '\]'
          if (-not (Select-String -Path CHANGELOG.md -Pattern $header -Quiet)) {
            throw "O CHANGELOG.md não tem a seção '## [$env:VERSION]'."
          }
          gh release view "v$env:VERSION" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "O release v$env:VERSION já existe." }
          $global:LASTEXITCODE = 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --locked

      - name: Compilar (otimizado) e montar o instalador
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Hash e notas da versão
        shell: pwsh
        run: |
          $installer = "dist/Acervo-Setup-$env:VERSION.exe"
          if (-not (Test-Path $installer)) { throw "O instalador não foi gerado: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Acervo-Setup-$env:VERSION.exe" | Set-Content "dist/Acervo-Setup-$env:VERSION.sha256.txt" -Encoding ascii

          # As notas do release são a seção da versão no CHANGELOG.md.
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $header = '^## \[' + [regex]::Escape($env:VERSION) + '\]'
          $start = ($lines | Select-String -Pattern $header | Select-Object -First 1).LineNumber
          $rest = @($lines[$start..($lines.Count - 1)])
          $next = $rest | Select-String -Pattern '^## \[' | Select-Object -First 1
          $body = if ($next -and $next.LineNumber -gt 1) { $rest[0..($next.LineNumber - 2)] } else { $rest }
          $body | Set-Content notes.md -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Acervo-Setup-${{ inputs.version }}
          path: dist/*

      - name: Criar o release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $flags = @()
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create "v$env:VERSION" `
            "dist/Acervo-Setup-$env:VERSION.exe" `
            "dist/Acervo-Setup-$env:VERSION.sha256.txt" `
            --target "$env:GITHUB_SHA" `
            --title "Acervo $env:VERSION" `
            --notes-file notes.md `
            @flags

[package]
name = "acervo"
version = "1.2.0"
edition = "2021"
description = "Catálogo rápido e leve de arquivos, HDs e jogos, feito para Windows"

[dependencies]
anyhow = "1"
jwalk = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
slint = "1"
rfd = "0.15"
trash = "5"
ntfs-reader = "0.6.0"
notify = "8"
flate2 = "1"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
memchr = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
winreg = "0.52"
windows-service = "0.8"

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

# Otimizado (opt-level 3) com LTO "thin": quase a velocidade do LTO completo e compila bem mais
# rápido, o que importa porque o projeto é recompilado várias vezes.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
